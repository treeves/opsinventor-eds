<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsInventor — Homepage Prototypes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Inter",sans-serif;background:#0B1115;color:#e8f4f6;height:100vh;display:flex;flex-direction:column;}
    .chooser{background:#0F1C23;border-bottom:3px solid #CE5B12;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap;}
    .chooser-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(232,244,246,.5);}
    .chooser-sep{color:rgba(232,244,246,.2);font-size:18px;}
    .btn{padding:8px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border:none;border-radius:0;}
    .btn-variant{background:rgba(255,255,255,.07);color:rgba(232,244,246,.7);}
    .btn-variant.active{background:#CE5B12;color:#fff;}
    .btn-variant:hover{background:rgba(206,91,18,.5);color:#fff;}
    .btn-article{background:transparent;border:1px solid rgba(206,91,18,.5);color:#CE5B12;}
    .btn-article:hover,.btn-article.active{background:#CE5B12;color:#fff;}
    iframe{flex:1;width:100%;border:none;}
    .spacer{flex:1;}
    .hint{font-size:11px;color:rgba(232,244,246,.3);letter-spacing:.04em;}
  </style>
</head>
<body>
<div class="chooser">
  <span class="chooser-label">Tad Reeves / OpsInventor</span>
  <span class="chooser-sep">|</span>
  <button class="btn btn-variant active" onclick="load('home-proposed.html',this)">★ PROPOSED (Rev 3)</button>
  <span class="chooser-sep">|</span>
  <span class="chooser-label" style="opacity:.4">Earlier:</span>
  <button class="btn btn-variant" onclick="load('home-proposed-option-c.html',this)">C — EDGE</button>
  <button class="btn btn-variant" onclick="load('home-proposed-option-b.html',this)">B — SIGNAL</button>
  <button class="btn btn-variant" onclick="load('home-proposed-option-a.html',this)">A — DEPLOY</button>
  <span class="spacer"></span>
  <button class="btn btn-article" onclick="load('__aem-infrastructure-and-personnel-strategy-a-talk-with-tom-johnson-of-hirobe-proposed.html',this)">Article prototype →</button>
  <span class="hint">Open in new tab for full-screen</span>
</div>
<iframe id="frame" src="home-proposed.html"></iframe>
<script>
function load(src,btn){
  document.getElementById('frame').src=src;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
</body>
</html>
