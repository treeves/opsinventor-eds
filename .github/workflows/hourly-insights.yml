name: Hourly Insights Page

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      index_url:
        description: Query index URL to read articles from
        required: false
        default: ''

permissions:
  contents: write

jobs:
  insights-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static insights page
        env:
          INSIGHTS_INDEX_URL: ${{ github.event.inputs.index_url || vars.INSIGHTS_INDEX_URL || 'https://www.opsinventor.com/opsinventor-en.json' }}
          INSIGHTS_OUTPUT: en/insights.plain.html
        run: node tools/insights/generate-insights-page.mjs

      - name: Detect generated changes
        id: changes
        run: |
          set -euo pipefail
          changed_files=$(git status --porcelain -- en/insights.plain.html)
          if [[ -n "$changed_files" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$changed_files"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated file changes detected."
          fi

      - name: Commit generated page
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/insights.plain.html
          git commit -m "chore(insights): rebuild static insights page"
          git push

      - name: Publish page to DA + live
        if: steps.changes.outputs.changed == 'true' && secrets.DA_TOKEN != '' && secrets.AEM_ADMIN_TOKEN != ''
        env:
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
          AEM_ADMIN_TOKEN: ${{ secrets.AEM_ADMIN_TOKEN }}
          INSIGHTS_OUTPUT: en/insights.plain.html
          INSIGHTS_DA_PATH: /en/insights.html
          INSIGHTS_HLX_PATH: en/insights
          INSIGHTS_PUBLISH_LIVE: 'true'
        run: node tools/da/push-insights-page.js
